<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D2142">
  <meta name="robots" content="noindex, nofollow">
  <title>استبانة — غراس</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/din-next-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    try { var t = localStorage.getItem("gheras-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="/kit.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="stage-mode">

  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <img class="topbar-logo logo-color" src="/assets/logo.png" alt="غراس">
      <img class="topbar-logo logo-white" src="/assets/logo-white.png" alt="" aria-hidden="true">
      <div class="topbar-title" id="topbarTitle"></div>
      <div class="topbar-end">
        <span class="topbar-save" id="saveState" aria-live="polite"></span>
        <button class="tt" id="themeToggle" type="button" aria-label="الوضع الليلي" aria-pressed="false">
          <span class="tt-hole" aria-hidden="true"></span>
          <svg class="tt-man" viewBox="0 0 12 22" aria-hidden="true">
            <circle cx="6" cy="3.2" r="2.6"/>
            <path class="tt-body" d="M6 6v7.5"/>
            <path class="tt-arm" d="M6 8.5 3 11.5M6 8.5l3 3"/>
            <path class="tt-leg tt-leg-a" d="M6 13.5 3.6 20"/>
            <path class="tt-leg tt-leg-b" d="M6 13.5 8.4 20"/>
          </svg>
          <span class="tt-knob" aria-hidden="true">
            <svg class="tt-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3 7 7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg>
            <svg class="tt-moon" viewBox="0 0 24 24"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z"/></svg>
          </span>
        </button>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
  </header>

  <div class="preview-bar" id="previewBar" hidden></div>

  <main id="app">
    <!-- المسرح: التحميل والدخول والإغلاق والخاتمة -->
    <section class="screen stage" id="screenStage">
      <div class="stage-light" aria-hidden="true"></div>
      <div class="stage-inner" id="stageInner">
        <div class="stage-logo">
          <span class="halo" aria-hidden="true"></span>
          <img src="/assets/logo-white.png" alt="جمعية غراس لتنمية الطفل">
        </div>
        <p class="stage-sub" id="stageLoading">جار تحميل الاستبانة…</p>
      </div>
    </section>

    <section class="screen steps" id="screenSteps" hidden>
      <div id="stepHost"></div>
    </section>
  </main>

  <nav class="dock" id="dock" hidden>
    <div class="dock-inner">
      <button class="btn btn-ghost" id="prevBtn" type="button">السابق</button>
      <div class="dock-count" id="dockCount"></div>
      <button class="btn btn-primary" id="nextBtn" type="button">التالي</button>
    </div>
  </nav>

  <!-- مشهد التوصيل أثناء الإرسال -->
  <div class="overlay" id="overlay" hidden>
    <div class="courier-wrap" role="status" aria-live="polite">
      <div class="courier-pill" id="courierPill">
        <span class="btn-label"><i class="dot"></i><span>إرسال الرد</span></span>
        <div class="courier-scene" aria-hidden="true">
          <span class="ground"></span>
          <svg class="sender" id="sender" viewBox="0 0 16 30">
            <circle class="head" cx="8" cy="4" r="3.2"/>
            <path d="M8 7.5V18"/>
            <path class="arm arm-r" d="M8 10.5 12 14"/><path class="arm arm-l" d="M8 10.5 4.5 15"/>
            <path class="leg leg-a" d="M8 18 5 27"/><path class="leg leg-b" d="M8 18l3 9"/>
          </svg>
          <span class="parcel" id="parcel"><i></i></span>
          <div class="scooter" id="scooter">
            <span class="speed"><i></i><i></i><i></i></span>
            <svg viewBox="0 0 120 54">
              <rect class="rack" x="6" y="22" width="34" height="14" rx="3"/>
              <rect class="stripe" x="10" y="27" width="10" height="2.4" rx="1.2"/>
              <path class="deck" d="M24 41h70"/>
              <rect class="seatbox" x="44" y="27" width="24" height="9" rx="4.5"/>
              <path class="body" d="M66 36c8 0 14-1 20-6"/>
              <rect class="lamp" x="62" y="31" width="13" height="4" rx="2"/>
              <path class="stem" d="M94 41 88 14M84 14h8"/>
              <g class="rider">
                <circle class="head" cx="58" cy="7" r="3.6"/>
                <path d="M57.5 11 55 26"/>
                <path d="M55 26h9l2 9"/>
                <path d="M57 15 87 15"/>
                <path class="rider-wave" d="M57 13.5l7-7"/>
              </g>
              <circle class="wheel" cx="22" cy="44" r="7"/><circle class="hub" cx="22" cy="44" r="2.4"/>
              <circle class="wheel" cx="96" cy="44" r="7"/><circle class="hub" cx="96" cy="44" r="2.4"/>
            </svg>
          </div>
        </div>
      </div>
      <p class="courier-label" id="overlayText">جار الإرسال…</p>
      <div class="bar" id="courierBar"><span id="overlayBar"></span></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer" id="footer">
    <div class="footer-inner">
      <div class="footer-text">
        <strong>جمعية غراس لتنمية الطفل</strong>
        <span>المملكة العربية السعودية — جمعية مسجلة بالمركز الوطني لتنمية القطاع غير الربحي، ترخيص رقم: ١١٩٨</span>
        <span>الرياض – السويدي الغربي</span>
      </div>
      <div class="footer-links">
        <a href="tel:0555432555" dir="ltr">0555432555</a>
        <a href="mailto:info@Gheras.sa" dir="ltr">info@Gheras.sa</a>
        <a href="https://www.Gheras.sa" target="_blank" rel="noopener" dir="ltr">www.Gheras.sa</a>
        <a href="https://x.com/GherasSA" target="_blank" rel="noopener" dir="ltr">@GherasSA</a>
      </div>
    </div>
  </footer>

  <script src="/config.js"></script>
  <script src="/schema.js"></script>
  <script src="/templates.js"></script>
  <script src="/api.js"></script>
  <script src="/kit.js"></script>
  <script src="/ui.js"></script>
  <script src="/form.js"></script>
</body>
</html>
